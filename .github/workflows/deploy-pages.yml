name: Deploy GitHub Pages (manual)

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Optional Pages CMS context as JSON
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BUNDLE_FROZEN: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - uses: actions/configure-pages@v6
        id: pages
      - name: Verify production custom domain
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [[ "$PAGES_ORIGIN" != "https://jliang.eitech.edu.cn" || -n "$PAGES_BASE_PATH" ]]; then
            echo "Production deployment blocked: GitHub Pages must use https://jliang.eitech.edu.cn with an empty base path."
            echo "Current configure-pages output: origin=$PAGES_ORIGIN base_path=$PAGES_BASE_PATH"
            exit 1
          fi
      - name: Write deployment URL override
        run: >-
          ruby -e 'require "yaml"; File.write("_config.deploy.yaml",
          {"url" => ARGV[0], "baseurl" => ARGV[1]}.to_yaml)'
          '${{ steps.pages.outputs.origin }}' '${{ steps.pages.outputs.base_path }}'
      - name: Build and validate deployment artifact
        env:
          BASEURL: ${{ steps.pages.outputs.base_path }}
          ORIGIN: ${{ steps.pages.outputs.origin }}
        run: bash script/test --config _config.yaml,_config.deploy.yaml
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
