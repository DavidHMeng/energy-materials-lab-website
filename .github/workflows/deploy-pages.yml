name: Deploy GitHub Pages (manual)

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Optional Pages CMS context as JSON
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BUNDLE_FROZEN: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _cite/requirements.txt
      - name: Prepare citation workspace from current content
        run: |
          python -m pip install --requirement _cite/requirements.txt
          python scripts/citation_registry.py --write
          python _cite/cite.py
          python scripts/citation_registry.py --check
      - uses: actions/configure-pages@v6
        id: pages
      - name: Verify GitHub Pages remains staging
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          test "$PAGES_ORIGIN" = "https://davidhmeng.github.io"
          test "$PAGES_BASE_PATH" = "/energy-materials-lab-website"
      - name: Build and validate staging deployment artifact
        env:
          JEKYLL_CONFIG: _config.yml,_config.staging.yml
          ORIGIN: https://davidhmeng.github.io
          CANONICAL_ORIGIN: https://jliang.eitech.edu.cn
          SITE_ENVIRONMENT: staging
          BASEURL: /energy-materials-lab-website
        run: |
          python scripts/citation_registry.py --check
          bash script/test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
