name: Publish production static branch

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-server-deploy
  cancel-in-progress: false

env:
  BUNDLE_FROZEN: true

jobs:
  citations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: _cite/requirements.txt
      - name: Rebuild citation data
        run: |
          python -m pip install --requirement _cite/requirements.txt
          python scripts/citation_registry.py --check
          cp _data/citations.yaml "$RUNNER_TEMP/citations.checked-in.yaml"
          python _cite/cite.py
      - name: Require checked-in citations to be current
        run: >-
          python scripts/check_citation_freshness.py
          "$RUNNER_TEMP/citations.checked-in.yaml"
          _data/citations.yaml

  translation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install PyYAML==6.0.3
      - name: Validate translation state and fallback mode
        run: |
          python scripts/test_translation.py
          python scripts/translate_content.py --dry-run

  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install PyYAML==6.0.3
      - name: Validate structured content and repository invariants
        run: |
          python scripts/validate_content.py
          python scripts/test_cms_record_independence.py

  build:
    needs: [citations, translation, content]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install PyYAML==6.0.3
      - name: Build production site
        run: bundle _2.5.6_ exec jekyll build --config _config.yml,_config.production.yml --destination _site --trace
      - name: Add public build manifest
        run: python scripts/write_version.py _site --source-commit "$GITHUB_SHA" --build-commit "$GITHUB_SHA" && touch _site/.nojekyll
      - name: Validate production artifact
        run: >-
          python scripts/check_generated_site.py _site
          --baseurl ""
          --origin https://jliang.eitech.edu.cn
          --canonical-origin https://jliang.eitech.edu.cn
          --environment production
          --require-version
      - name: Validate HTML and internal links
        run: bundle _2.5.6_ exec htmlproofer _site --disable-external --ignore-urls "/example\\.edu/"
      - uses: actions/upload-artifact@v4
        with:
          name: production-site-${{ github.sha }}
          path: _site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source only for authenticated Git transport
        uses: actions/checkout@v7
        with:
          path: publisher
          fetch-depth: 1
      - uses: actions/download-artifact@v8
        with:
          name: production-site-${{ github.sha }}
          path: release
      - name: Revalidate release root
        run: |
          test -f release/index.html
          test -f release/research/index.html
          test -f release/publications/index.html
          test -f release/team/index.html
          test -f release/opportunities/index.html
          test -f release/zh/index.html
          test -f release/sitemap.xml
          test -f release/robots.txt
          test -f release/version.json
      - name: Publish static files at server-deploy branch root
        working-directory: publisher
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git switch --orphan server-deploy-next
          git rm -rf --ignore-unmatch .
          rsync -a --delete --exclude '.git/' ../release/ ./
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "deploy: production ${SOURCE_SHA}"
          git push --force origin HEAD:server-deploy
          echo "server-deploy commit: $(git rev-parse HEAD)"
