name: Build GitHub Pages staging artifact

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Optional Pages CMS context as JSON
        required: false
        type: string

permissions:
  contents: read

env:
  BUNDLE_FROZEN: true

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install PyYAML==6.0.3
      - name: Build and validate staging artifact
        env:
          JEKYLL_CONFIG: _config.yml,_config.staging.yml
          ORIGIN: https://davidhmeng.github.io
          CANONICAL_ORIGIN: https://jliang.eitech.edu.cn
          SITE_ENVIRONMENT: staging
          BASEURL: /energy-materials-lab-website
        run: |
          python scripts/citation_registry.py --check
          bash script/test
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages-staging
          path: _site
          if-no-files-found: error
          retention-days: 7
