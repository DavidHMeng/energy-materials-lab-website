name: Build GitHub Pages staging artifact

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUNDLE_FROZEN: true

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install PyYAML==6.0.3
      - run: bash script/test
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages-staging
          path: _site
          if-no-files-found: error
          retention-days: 7
