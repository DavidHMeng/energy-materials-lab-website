name: Validate and build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  BUNDLE_FROZEN: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install PyYAML==6.0.3
      - name: Validate production build
        env:
          JEKYLL_CONFIG: _config.yml,_config.production.yml
          ORIGIN: https://jliang.eitech.edu.cn
          CANONICAL_ORIGIN: https://jliang.eitech.edu.cn
          SITE_ENVIRONMENT: production
          BASEURL: ""
        run: bash script/test
