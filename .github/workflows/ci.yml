name: Validate and build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install PyYAML~=6.0
      - run: python scripts/validate_content.py
      - run: JEKYLL_ENV=production bundle exec jekyll build
      - run: python scripts/check_generated_site.py _site
      - run: bundle exec htmlproofer _site --disable-external --ignore-urls "/example\\.edu/"
