name: Refresh DOI citations (manual)

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Optional Pages CMS context as JSON
        required: false
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  refresh:
    uses: ./.github/workflows/update-citations.yaml
    with:
      open-pr: true
    secrets: inherit
