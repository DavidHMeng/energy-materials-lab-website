name: Synchronize DOI citation registry

on:
  push:
    branches: [main]
    paths:
      - "_data/sources.yaml"
      - "_data/homepage.yaml"
      - "_members/**"
      - "_research/**"
  workflow_dispatch:
    inputs:
      payload:
        description: Optional Pages CMS context as JSON
        required: false
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip citation-sync]')
    uses: ./.github/workflows/update-citations.yaml
    with:
      open-pr: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit
