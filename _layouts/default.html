{% assign typography = site.data.site.typography %}
<!DOCTYPE html>
<html
  lang="{{ page.lang | default: 'en' }}"
  data-heading-font="{{ typography.heading_font | default: 'default' }}"
  data-body-font="{{ typography.body_font | default: 'default' }}"
  data-lab-name-size="{{ typography.lab_name_size | default: 'default' }}"
  data-navigation-size="{{ typography.navigation_size | default: 'default' }}"
  data-page-title-size="{{ typography.page_title_size | default: 'default' }}"
  data-section-title-size="{{ typography.section_title_size | default: 'default' }}"
  data-body-text-size="{{ typography.body_text_size | default: 'default' }}"
  data-caption-size="{{ typography.caption_size | default: 'default' }}"
  data-line-height="{{ typography.line_height | default: 'default' }}"
>
  {% include head.html %}
  <body class="{{ page.page_class | default: '' }}">
    <a class="skip-link" href="#main-content">{% if page.lang == 'zh' %}跳至主要内容{% else %}Skip to main content{% endif %}</a>
    {% include header.html %}
    <main id="main-content">
      {% include content.html content=content %}
    </main>
    {% include footer.html %}
  </body>
</html>
