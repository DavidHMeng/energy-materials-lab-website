media:
  - name: images
    label: Media
    input: images/uploads
    output: /images/uploads
    rename: safe
    categories: [image]

content:
  - name: homepage
    label: Homepage Settings
    type: file
    path: _data/homepage.yaml
    fields:
      - name: introduction
        label: Homepage Introduction
        type: object
        required: true
        fields:
          - { name: eyebrow_zh, label: "中文（必填）— 栏目标题", type: string, required: true }
          - { name: title_zh, label: "中文（必填）— Slogan", type: string, required: true }
          - { name: text_zh, label: "中文（必填）— 简介", type: text, required: true }
          - { name: eyebrow_en, label: "English (optional) — Section label", type: string, description: "Generated from Chinese when empty. Manual English always takes priority." }
          - { name: title_en, label: "English (optional) — Slogan", type: string, description: "Generated from Chinese when empty. Manual English always takes priority." }
          - { name: text_en, label: "English (optional) — Introduction", type: text, description: "Generated from Chinese when empty. Manual English always takes priority." }
          - { name: autoplay_seconds, label: Seconds per slide, type: number, required: true, default: 6, description: Recommended range is 5 to 8 seconds. }
          - name: slides
            label: Visual Slides
            type: object
            required: true
            list:
              collapsible: { collapsed: true, summary: "{caption_zh}" }
            fields:
              - { name: image, label: Image, type: image, required: true, options: { media: images } }
              - { name: alt_zh, label: "中文（必填）— 图片替代文本", type: string, required: true }
              - { name: alt_en, label: "English (optional) — Image alt", type: string, description: "Generated from Chinese when empty." }
              - name: visual_type
                label: Visual Type
                type: select
                required: true
                options:
                  values:
                    - { name: graphical-abstract, label: A - Graphical Abstract }
                    - { name: lab-photo, label: B - Lab / Group Photo }
              - { name: caption_zh, label: "中文 — 图片说明", type: string }
              - { name: caption_en, label: "English (optional) — Caption", type: string, description: "Generated from Chinese when the Chinese caption is provided." }
              - { name: related_doi, label: Related DOI, type: string, pattern: { regex: "^\\s*(?:(?:(?:[hH][tT][tT][pP][sS]?://(?:[dD][xX]\\.)?[dD][oO][iI]\\.[oO][rR][gG]/)|(?:[dD][oO][iI][:：]))?10\\.\\d{4,9}/\\S+)?\\s*$", message: "Enter a DOI such as 10.1021/jacs.5c22628 or its doi.org URL." }, description: "Optional DOI or doi.org URL. It is normalized automatically; journal and year come from the shared citation registry." }
              - { name: display, label: Display, type: boolean, default: true }
              - { name: order, label: Display Order, type: number, required: true }
      - { name: highlights_heading_zh, label: Highlights heading ZH, type: string, required: true }
      - { name: highlights_heading_en, label: "Highlights heading EN (optional)", type: string, description: "Generated from Chinese when empty." }
      - { name: events_heading_zh, label: Events heading ZH, type: string, required: true }
      - { name: events_heading_en, label: "Events heading EN (optional)", type: string, description: "Generated from Chinese when empty." }
      - { name: news_limit, label: News items on homepage, type: number, required: true }
      - { name: events_limit, label: Event items on homepage, type: number, required: true }

  - name: news
    label: Highlights / News
    type: collection
    path: _news
    format: yaml-frontmatter
    filename: "{date}-{title_zh}.md"
    view:
      fields: [title_zh, title_en, category, date, display]
      primary: title_zh
      sort: [date, category, title_zh]
      default: { sort: date, order: desc }
    fields:
      - name: category
        label: Category
        type: select
        required: true
        options:
          values: [Publication, Award, Member, Academic Achievement, Funding, Announcement]
      - { name: title_zh, label: "中文（必填）— 标题", type: string, required: true }
      - { name: summary_zh, label: "中文（必填）— 摘要", type: text, required: true }
      - { name: title_en, label: "English (optional) — Title", type: string, description: "Generated from Chinese when empty. Manual English always takes priority." }
      - { name: summary_en, label: "English (optional) — Summary", type: text, description: "Generated from Chinese when empty. Manual English always takes priority." }
      - { name: date, label: Date, type: date, required: true, options: { format: yyyy-MM-dd } }
      - { name: image, label: Image, type: image, options: { media: images } }
      - { name: alt_en, label: Image alt EN, type: string }
      - { name: alt_zh, label: Image alt ZH, type: string }
      - { name: external_link, label: External link, type: string }
      - { name: display, label: Display, type: boolean, default: true }

  - name: events
    label: Events
    type: collection
    path: _events
    format: yaml-frontmatter
    filename: "{date}-{title_zh}.md"
    view:
      fields: [title_zh, title_en, type, category, date, display]
      primary: title_zh
      sort: [date, type, title_zh]
      default: { sort: date, order: desc }
    fields:
      - name: type
        label: Type
        type: select
        required: true
        options: { values: [Academic, Group] }
      - { name: category, label: Category, type: string, required: true }
      - { name: title_zh, label: "中文（必填）— 标题", type: string, required: true }
      - { name: title_en, label: "English (optional) — Title", type: string, description: "Generated from Chinese when empty. Manual English always takes priority." }
      - { name: date, label: Date, type: date, required: true, options: { format: yyyy-MM-dd } }
      - { name: end_date, label: End date, type: date, default: "", options: { format: yyyy-MM-dd } }
      - { name: location_zh, label: Location ZH, type: string }
      - { name: location_en, label: "Location EN (optional)", type: string, description: "Generated from Chinese when the Chinese location is provided." }
      - { name: cover_image, label: Cover image, type: image, options: { media: images } }
      - { name: alt_en, label: Cover alt EN, type: string }
      - { name: alt_zh, label: Cover alt ZH, type: string }
      - name: gallery
        label: Gallery
        type: image
        options: { media: images, multiple: true, unique: true }
      - { name: description_zh, label: Description ZH, type: rich-text, options: { media: false } }
      - { name: description_en, label: "Description EN (optional)", type: rich-text, options: { media: false }, description: "Generated from Chinese when the Chinese description is provided." }
      - { name: external_link, label: External link, type: string }
      - { name: display, label: Display, type: boolean, default: true }

  - name: research
    label: Research
    type: collection
    path: _research
    format: yaml-frontmatter
    filename: "{title_zh}.md"
    view:
      fields: [title_zh, title_en, order, display]
      primary: title_zh
      sort: [order, title_zh]
      default: { sort: order, order: asc }
    fields:
      - { name: title_zh, label: "中文（必填）— 标题", type: string, required: true }
      - { name: title_en, label: "English (optional) — Title", type: string, description: "Generated from Chinese when empty. Manual English always takes priority." }
      - { name: graphical_abstract, label: Graphical Abstract, type: image, required: true, options: { media: images } }
      - { name: alt_zh, label: Alt ZH, type: string, required: true }
      - { name: alt_en, label: "Alt EN (optional)", type: string, description: "Generated from Chinese when empty." }
      - { name: short_intro_zh, label: Short Intro ZH, type: text, required: true }
      - { name: short_intro_en, label: "Short Intro EN (optional)", type: text, description: "Generated from Chinese when empty." }
      - { name: doi_list, label: DOI list, type: string, list: true, pattern: { regex: "^\\s*(?:(?:[hH][tT][tT][pP][sS]?://(?:[dD][xX]\\.)?[dD][oO][iI]\\.[oO][rR][gG]/)|(?:[dD][oO][iI][:：]))?10\\.\\d{4,9}/\\S+\\s*$", message: "Enter a DOI such as 10.1021/jacs.5c22628 or its doi.org URL." }, description: DOI or doi.org URL; values are normalized and deduplicated automatically. }
      - { name: display, label: Display, type: boolean, default: true }
      - { name: order, label: Order, type: number, required: true }

  - name: publications
    label: Publications
    type: file
    path: _data/sources.yaml
    format: yaml
    list: true
    fields:
      - name: id
        label: DOI
        type: string
        required: true
        pattern:
          regex: "^\\s*(?:(?:[hH][tT][tT][pP][sS]?://(?:[dD][xX]\\.)?[dD][oO][iI]\\.[oO][rR][gG]/)|(?:[dD][oO][iI][:：]))?10\\.\\d{4,9}/\\S+\\s*$"
          message: "Enter 10.xxxx/xxxxx or a complete doi.org URL; no doi: prefix is required."
      - { name: type, label: Type, type: string, default: paper }
      - { name: member_ids, label: Member IDs, type: string, list: true, description: Match Team slug values. }
      - { name: description_en, label: Custom note EN, type: rich-text, options: { media: false } }
      - { name: description_zh, label: Custom note ZH, type: rich-text, options: { media: false } }
      - { name: image, label: Citation image, type: image, options: { media: images } }
      - { name: tags, label: Tags, type: string, list: true }

  - name: team
    label: Team
    type: collection
    path: _members
    format: yaml-frontmatter
    filename:
      template: "{slug}.md"
      field: create
    view:
      fields: [name_en, role, active, display, order]
      primary: name_en
      sort: [role, order, name_en]
      default: { sort: order, order: asc }
    fields:
      - { name: slug, label: Member ID / slug, type: string, required: true, pattern: "^[a-z0-9-]+$" }
      - { name: role, label: Role ID, type: string, required: true, pattern: "^[a-z0-9-]+$", description: Use an ID configured under Team Role Labels. This permits new member categories without a code change. }
      - { name: name_zh, label: Name ZH, type: string, required: true }
      - { name: name_en, label: "Name EN (optional; enter official spelling)", type: string, description: "Never auto-translated or romanized. Chinese is shown until official English is supplied." }
      - { name: position_zh, label: Position ZH, type: string, required: true }
      - { name: position_en, label: "Position EN (optional)", type: string, description: "Generated from Chinese when empty; replace with the official title when available." }
      - { name: portrait, label: Portrait, type: image, required: true, options: { media: images } }
      - { name: portrait_alt_zh, label: Portrait alt ZH, type: string, required: true }
      - { name: portrait_alt_en, label: "Portrait alt EN (optional)", type: string, description: "Generated from Chinese when empty." }
      - { name: research_summary_zh, label: Short research area ZH, type: text, required: true }
      - { name: research_summary_en, label: "Short research area EN (optional)", type: text, description: "Generated from Chinese when empty." }
      - { name: affiliation_zh, label: Affiliation ZH, type: string }
      - { name: affiliation_en, label: "Affiliation EN (optional)", type: string, description: "Generated when empty; use official English when available." }
      - { name: profile_summary_zh, label: "Profile Summary ZH", type: text, required: true, description: "50–120 English-word equivalent. Academic background and current work; do not repeat Education." }
      - { name: profile_summary_en, label: "Profile Summary EN (optional)", type: text, description: "Generated from Chinese when empty. Manual English always takes priority." }
      - { name: address_zh, label: Address ZH, type: text }
      - { name: address_en, label: "Address EN (optional)", type: text, description: "Generated when empty; official English may be entered manually." }
      - { name: research_interests_zh, label: Research interests ZH, type: text }
      - { name: research_interests_en, label: "Research interests EN (optional)", type: text, description: "Generated from Chinese when empty." }
      - { name: personal_note_zh, label: Personal Note ZH, type: text, description: Optional plain text only. Images, tables, HTML, and rich media are not supported. }
      - { name: personal_note_en, label: "Personal Note EN (optional)", type: text, description: "Generated from Chinese when empty. Plain text only." }
      - { name: education_zh, label: Education ZH, type: rich-text, options: { media: false } }
      - { name: education_en, label: "Education EN (optional)", type: rich-text, options: { media: false }, description: "Generated from Chinese when empty." }
      - { name: email, label: Email, type: string }
      - { name: google_scholar, label: Google Scholar, type: string }
      - { name: orcid, label: ORCID, type: string }
      - { name: researchgate, label: ResearchGate, type: string }
      - { name: personal_website, label: Personal Website, type: string }
      - { name: github, label: GitHub, type: string }
      - { name: representative_dois, label: Representative Publication DOIs, type: string, list: true, pattern: { regex: "^\\s*(?:(?:[hH][tT][tT][pP][sS]?://(?:[dD][xX]\\.)?[dD][oO][iI]\\.[oO][rR][gG]/)|(?:[dD][oO][iI][:：]))?10\\.\\d{4,9}/\\S+\\s*$", message: "Enter a DOI such as 10.1021/jacs.5c22628 or its doi.org URL." }, description: "Usually 3–6 values. DOI URLs are accepted; values are normalized and resolved through the shared citation registry." }
      - { name: active, label: Active member, type: boolean, default: true }
      - { name: display, label: Display, type: boolean, default: true }
      - { name: order, label: Order, type: number, required: true }

  - name: team-roles
    label: Team Role Labels
    type: file
    path: _data/team_roles.yaml
    format: yaml
    list: true
    fields:
      - { name: id, label: Role ID, type: string, required: true, pattern: "^[a-z0-9-]+$", description: Stable ID used by Team members, for example visiting-students. }
      - { name: label_zh, label: Display Label ZH, type: string, required: true }
      - { name: label_en, label: "Display Label EN (optional; official wording)", type: string, description: "Not machine-translated; Chinese is shown until official English is supplied." }
      - { name: display, label: Display category, type: boolean, default: true }
      - { name: order, label: Display Order, type: number, required: true }

  - name: opportunities
    label: Opportunities
    type: collection
    path: _opportunities
    format: yaml-frontmatter
    filename: "{title_zh}.md"
    view:
      fields: [title_zh, title_en, category, active_override, closing_date, display_order]
      primary: title_zh
      sort: [category, display_order, closing_date]
      default: { sort: display_order, order: asc }
    fields:
      - name: category
        label: Category
        type: select
        required: true
        options:
          values: [PhD Students, Research Assistants, Administrative Assistants, Assistant Professors, Postdoctoral Researchers, Visiting Students, Other]
      - { name: title_zh, label: Title ZH, type: string, required: true }
      - { name: title_en, label: "Title EN (optional)", type: string, description: "Generated from Chinese when empty; official recruitment titles should be reviewed manually." }
      - { name: content_zh, label: Content ZH, type: rich-text, required: true, options: { media: false } }
      - { name: content_en, label: "Content EN (optional)", type: rich-text, options: { media: false }, description: "Generated from Chinese when empty. Manual English always takes priority." }
      - name: links
        label: Links
        type: object
        list:
          collapsible: { collapsed: true, summary: "{label_zh}" }
        fields:
          - { name: label_zh, label: Label ZH, type: string, required: true }
          - { name: label_en, label: "Label EN (optional)", type: string, description: "Generated from Chinese when empty." }
          - { name: url, label: URL, type: string, required: true }
      - name: active_override
        label: Active override
        type: select
        required: true
        default: auto
        description: auto follows dates; force_show and force_hide override dates.
        options:
          values:
            - { name: auto, label: Auto from dates }
            - { name: force_show, label: Force show }
            - { name: force_hide, label: Force hide }
      - { name: display_order, label: Display Order, type: number, required: true }
      - { name: opening_date, label: Opening Date, type: date, default: "", options: { format: yyyy-MM-dd } }
      - { name: closing_date, label: Closing Date, type: date, default: "", options: { format: yyyy-MM-dd } }
      - { name: display, label: Display, type: boolean, default: true }

  - name: site
    label: Site Settings
    type: file
    path: _data/site.yaml
    fields:
      - { name: lab_name_zh, label: Lab name ZH, type: string, required: true }
      - { name: lab_name_en, label: "Lab name EN (optional; official wording)", type: string, description: "Never guessed by automation. Chinese is shown until official English is entered." }
      - { name: school_zh, label: School ZH, type: string, required: true }
      - { name: school_en, label: "School EN (optional; official wording)", type: string, description: "Never guessed by automation. Chinese is shown until official English is entered." }
      - { name: college_zh, label: College ZH, type: string, required: true }
      - { name: college_en, label: "College EN (optional; official wording)", type: string, description: "Never guessed by automation. Chinese is shown until official English is entered." }
      - { name: address_zh, label: Address ZH, type: text, required: true }
      - { name: address_en, label: "Address EN (optional)", type: text, description: "Generated from Chinese when empty; official English takes priority." }
      - { name: email, label: Email, type: string, required: true }
      - { name: header_image, label: Header campus image, type: image, required: true, options: { media: images } }
      - { name: lab_logo, label: Lab logo, type: image, required: true, options: { media: images } }
      - { name: school_logo, label: School logo, type: image, required: true, options: { media: images } }
      - { name: copyright_zh, label: Copyright ZH, type: string, required: true }
      - { name: copyright_en, label: "Copyright EN (optional)", type: string, description: "Generated from Chinese when empty." }
      - { name: description_zh, label: Site description ZH, type: text, required: true }
      - { name: description_en, label: "Site description EN (optional)", type: text, description: "Generated from Chinese when empty." }
      - name: typography
        label: Typography
        type: object
        required: true
        description: Controlled presets preserve responsive sizing and visual consistency. Arbitrary CSS values are intentionally unavailable.
        fields:
          - name: heading_font
            label: Heading Font
            type: select
            required: true
            default: default
            options:
              values:
                - { name: default, label: Default }
                - { name: sans-modern, label: Sans Modern }
                - { name: sans-academic, label: Sans Academic }
                - { name: serif-editorial, label: Serif Editorial }
          - name: body_font
            label: Body Font
            type: select
            required: true
            default: default
            options:
              values:
                - { name: default, label: Default }
                - { name: sans, label: Sans }
                - { name: serif, label: Serif }
          - { name: lab_name_size, label: Lab Name Size, type: select, required: true, default: default, options: { values: [small, default, large] } }
          - { name: navigation_size, label: Navigation Size, type: select, required: true, default: default, options: { values: [small, default, large] } }
          - { name: page_title_size, label: Page Title Size, type: select, required: true, default: default, options: { values: [small, default, large] } }
          - { name: section_title_size, label: Section Title Size, type: select, required: true, default: default, options: { values: [small, default, large] } }
          - { name: body_text_size, label: Body Text Size, type: select, required: true, default: default, options: { values: [small, default, large] } }
          - { name: caption_size, label: Caption Size, type: select, required: true, default: default, options: { values: [small, default, large] } }
          - { name: line_height, label: Line Height, type: select, required: true, default: default, options: { values: [compact, default, relaxed] } }

settings:
  content:
    merge: true
  commit:
    templates:
      create: "content: add {filename}"
      update: "content: update {filename}"
      delete: "content: remove {filename}"
      rename: "content: rename {oldFilename} to {newFilename}"

actions:
  - name: translate-content
    label: Generate pending English
    workflow: translate-content.yml
    ref: current
    confirm:
      title: Generate pending English?
      message: Fill missing or previously auto-generated English. Manual English is never overwritten.
      button: Generate
  - name: deploy-site
    label: Deploy website
    workflow: deploy-pages.yml
    ref: current
    cancelable: false
    confirm:
      title: Deploy website?
      message: Run the validated GitHub Pages production deployment for the current branch.
      button: Deploy
  - name: build-staging
    label: Build staging artifact
    workflow: pages-staging.yml
    ref: current
    confirm:
      title: Build staging artifact?
      message: Build and validate a downloadable seven-day site artifact without publishing it.
      button: Build
  - name: refresh-citations
    label: Synchronize DOI citations
    workflow: citation-schedule.yml
    ref: current
    confirm:
      title: Synchronize citations?
      message: Normalize DOI inputs, collect all page references into the central registry, and refresh metadata.
      button: Synchronize
