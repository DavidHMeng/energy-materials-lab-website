introduction:
  eyebrow_en: Introduction
  eyebrow_zh: 课题组简介
  title_en: From Solid-State Materials to Energy Technologies.
  title_zh: 从固态材料，走向能源技术
  text_en: >-
    The Solid-State Energy Laboratory develops advanced materials and
    engineering strategies for emerging solid-state energy technologies. Our
    research bridges fundamental materials chemistry and engineering
    development, with a current focus on solid-state electrolytes and related
    energy materials.

    Beyond conventional battery systems, we explore new materials, chemistries,
    and technological directions toward an open and extensible platform for
    future energy technologies.
  text_zh: |-
    Solid-State Energy Laboratory 致力于面向新型能源技术的先进材料研究与工程开发，以固态电解质和固态能源体系作为重要研究基础。我们将基础材料化学与工程导向研究相结合，覆盖材料设计、合成、表征和性能优化，推动科学认知向实际技术开发延伸。
    在传统锂电池体系之外，我们希望逐步建立一个开放、可扩展的下一代固态能源技术研究平台。通过严谨的科学研究、系统化工程方法和持续探索，推动新材料与新概念向可靠、可扩展并具有实际价值的能源技术发展。
  autoplay_seconds: 6
